# Manifest Flatpak dasar. Terminal & ssh dijalankan di host lewat `flatpak-spawn --host`
# (lihat src/terminal.rs), jadi ~/.ssh, ssh-agent, dan shell pengguna tetap terpakai.
#
# Catatan: build ini mengunduh crate dari crates.io saat build (--share=network).
# Untuk Flathub nanti perlu cargo-sources.json (flatpak-cargo-generator) agar offline.
app-id: com.latiefahmad.zterm
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zterm
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=~/.ssh:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/zterm/cargo
modules:
  - name: zterm
    buildsystem: simple
    sources:
      - type: dir
        path: ../../..
        skip:
          - apps/linux/target
          - apps/linux/build-flatpak
          - apps/linux/.flatpak-builder
          - core/target
          - dist
    build-commands:
      - cargo build --release --manifest-path apps/linux/Cargo.toml
      - install -Dm755 apps/linux/target/release/zterm /app/bin/zterm
      - install -Dm644 apps/linux/data/com.latiefahmad.zterm.desktop /app/share/applications/com.latiefahmad.zterm.desktop
      - install -Dm644 apps/linux/data/icons/com.latiefahmad.zterm.png /app/share/icons/hicolor/512x512/apps/com.latiefahmad.zterm.png
      - mkdir -p /app/share/icons/hicolor/scalable/actions
      - cp -r apps/linux/data/icons/hicolor/scalable/actions/. /app/share/icons/hicolor/scalable/actions/
      - install -Dm644 apps/linux/data/com.latiefahmad.zterm.metainfo.xml /app/share/metainfo/com.latiefahmad.zterm.metainfo.xml
