name: Build check

# Verifikasi kompilasi macOS + Windows + Linux tanpa menerbitkan rilis.
# Jalankan manual dari tab Actions (atau `gh workflow run ci.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Build zterm-core (xcframework + binding Swift)
        run: ./scripts/build-core-apple.sh

      - name: Generate project & build app
        working-directory: apps/macos
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Zterm.xcodeproj -scheme Zterm -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="1.0.0" CURRENT_PROJECT_VERSION="1" build

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build zterm-core (DLL ARM64 + x64 + binding C#)
        shell: pwsh
        run: ./scripts/build-core-windows.ps1

      - name: Build app
        shell: pwsh
        run: dotnet build apps/windows/Zterm/Zterm.csproj -c Release -p:Platform=x64 -r win-x64

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Pasang GTK4, libadwaita, VTE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/linux -> target

      - name: Cek kompilasi
        run: cargo check --manifest-path apps/linux/Cargo.toml --locked

      - name: Cek aset ikon Phosphor
        run: |
          set -euo pipefail
          missing=0
          for name in $(grep -rhoE 'icons::(themed|image|button|menu_button|content)\("[a-z0-9-]+"' apps/linux/src | sed -E 's/.*"([a-z0-9-]+)"/\1/' | sort -u); do
            if [ ! -f "apps/linux/data/icons/hicolor/scalable/actions/zterm-$name-symbolic.svg" ]; then
              echo "Ikon tidak ditemukan: $name"
              missing=1
            fi
          done
          exit $missing
